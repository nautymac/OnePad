; OnePad 설정 - abxylute 3D One 터치패드/백버튼/자이로 변환 서비스
; 저장 후 트레이 메뉴의 '설정 다시 읽기' 또는 서비스 재시작

[general]
enabled=1
; 실행 중 백버튼(M1/M2)의 펌웨어 매핑을 해제해 L3/R3 입력이 섞이지 않게 함
unmap_grips=1
; 종료 시 펌웨어 설정을 원래대로 복원
restore_on_exit=1
; 로그온 시 자동 시작 작업(OnePad)을 첫 실행 때 스스로 등록
autostart=1
debug=0

[pad.right]
; mode: mouse | scroll | dpad | native_touchpad | native_wheel | native_leftstick | native_rightstick | off
mode=mouse
; 모드시프트 그립을 누르는 동안의 모드
shift_mode=off
; 1 = 펌웨어 터치패드 모드(손가락 움직일 때 진동), 0 = 휠 모드(진동 없음)
haptics=1
; mouse 모드
sensitivity=0.80
accel=0.00
friction=0.00
flick_min=6.0
tap=left
tap_ms=180
tap_dist=24
; 탭 직후 다시 대고 끌면 왼쪽 버튼 유지(드래그)
tap_drag=0
; scroll 모드
scroll_step=40
scroll_invert=0
scroll_horizontal=1
; dpad 모드 (위,아래,왼쪽,오른쪽 키)
dpad_keys=UP,DOWN,LEFT,RIGHT
dpad_deadzone=0.25
dpad_8way=0
; 센서 좌표 뒤집기 (왼쪽 패드는 180도 돌아가 있어 기본 1,1)
flip_x=0
flip_y=0

[pad.left]
; mode: mouse | scroll | dpad | native_touchpad | native_wheel | native_leftstick | native_rightstick | off
mode=scroll
; 모드시프트 그립을 누르는 동안의 모드
shift_mode=off
; 1 = 펌웨어 터치패드 모드(손가락 움직일 때 진동), 0 = 휠 모드(진동 없음)
haptics=1
; mouse 모드
sensitivity=1.20
accel=0.00
friction=0.00
flick_min=6.0
tap=left
tap_ms=180
tap_dist=24
; 탭 직후 다시 대고 끌면 왼쪽 버튼 유지(드래그)
tap_drag=0
; scroll 모드
scroll_step=50
scroll_invert=0
scroll_horizontal=1
; dpad 모드 (위,아래,왼쪽,오른쪽 키)
dpad_keys=UP,DOWN,LEFT,RIGHT
dpad_deadzone=0.25
dpad_8way=0
; 센서 좌표 뒤집기 (왼쪽 패드는 180도 돌아가 있어 기본 1,1)
flip_x=1
flip_y=1

[grip.left]
; none | modeshift | gyro_hold | gyro_toggle | key:CTRL+C | mouse:left|right|middle|x1|x2
action=mouse:left
bit=0x10

[grip.right]
action=mouse:right
bit=0x80

[gyro]
; mode: off | mouse
mode=off
; activate: always | grip (gyro_hold 그립) | right_touch (오른쪽 패드 터치 중) | left_touch | toggle (gyro_toggle 그립)
activate=grip
; 사용할 IMU: right | left
side=right
; 1도 회전당 마우스 픽셀
sensitivity=10.00
invert_x=0
invert_y=0
; 자이로 원시값 -> deg/s 변환 계수
scale_dps=16.40
; yaw: world (중력 기준 수평 회전) | x | y | z,  pitch: x | y | z
yaw=world
pitch=y
deadzone=0.40
bias_left_x=9.256
bias_left_y=-53.052
bias_left_z=-21.440
bias_right_x=19.900
bias_right_y=-44.320
bias_right_z=1.272

[devices]
; 서비스 실행 중 비활성화할 HID 컬렉션 (정밀 터치패드 2개, 마우스 컬렉션)
ptp_right=COL03
ptp_left=COL05
mouse=COL02

[deck]
; Steam Deck 컨트롤러(28DE:1205) 에뮬레이션. usbip-win2 드라이버 필요. Steam이 점유하면 위 변환은 자동 정지.
enabled=1
port=3240
busid=1-1
usbip_exe=C:\Program Files\USBip\usbip.exe
auto_attach=1
attach_args=attach -r 127.0.0.1 -b 1-1
detach_args=detach --all
stop_attempts_args=attach -r 127.0.0.1 -b 1-1 --stop
; 3D One이 사라진 뒤 가상 장치를 뽑기까지 기다리는 초 (절전/재접속 때 뽑았다 꽂지 않도록)
detach_delay_s=90
serial=FX1A00000001
; Deck IMU 축 <- 3D One 축 (+x/-x/+y/-y/+z/-z)
axis_x=-y
axis_y=-x
axis_z=-z
accel_scale=4.00
gyro_scale=1.000
; 1 = Home 버튼을 Steam 버튼, Setup 버튼을 QAM(...)으로; 0 = 반대
home_is_guide=1
rumble_gain=1.00
; 패드 터치 중 보고하는 압력 (0 = 터치만, 클릭으로 보지 않음)
pad_pressure=0
; 패드 라우팅: games_only = Steam 게임이 앞에 있을 때만 패드/그립/자이로를 Steam으로, always = 점유 중 항상, never = 게임에서도 OnePad가 처리(Steam 트랙볼/자이로 기능 미사용)
pads_to_steam=games_only
; 버튼·스틱·트리거 라우팅: games_only = Steam 게임 또는 Steam 창이 앞에 있을 때만 (데스크톱에서 Steam 데스크톱 레이아웃이 B=Space, X=PageUp 같은 키 입력을 만드는 것을 막음), always = 점유 중 항상. Steam/QAM 버튼은 항상 전달
buttons_to_steam=games_only
; 게임에서 탭 = Deck 트랙패드 클릭, 탭 후 다시 대고 끌기 = 클릭 유지
tap_click=1
tap_drag=0
tap_ms=180
tap_dist=24

[hidhide]
; (선택) HidHide 숨김: auto | always | never. Steam은 WGI 경로로 Xbox 패드를 계속 보므로 기본 never
mode=always
cli=

[xbox]
; 실제 Xbox(XUSB) 장치 노드 비활성화: auto = Steam 실행 중에만(권장), always, never. Steam이 Deck 에뮬만 1번 컨트롤러로 보게 함
hide=never

; [deck] View/Menu 버튼의 벤더 바이트(1-4)와 비트 마스크 (probe learn 으로 확인)
[deck.buttons]
view_byte=3
view_mask=0x02
menu_byte=3
menu_mask=0x01
